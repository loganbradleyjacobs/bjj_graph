<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>BJJ Recursive Graph (Cytoscape)</title>
    <script src="https://unpkg.com/cytoscape@3.25.2/dist/cytoscape.min.js"></script>
    <script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
    <script src="https://unpkg.com/cytoscape-dagre/cytoscape-dagre.js"></script>
    <script src="https://unpkg.com/webcola/WebCola/cola.min.js"></script>
    <script src="https://unpkg.com/cytoscape-cola/cytoscape-cola.js"></script>
    <link rel="stylesheet" href="/static/styles.css"><link>
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <div id="cy"></div>
    <div id="tree-container" class="hidden">
      <div id="tree-empty-state" class="tree-empty hidden">Tree View is ready.</div>
    </div>
    <div id="node-sidebar" class="node-sidebar hidden">
      <button id="closeSidebar">×</button>
      <h2 id="sidebarLabel"></h2>
      <p><strong>Type:</strong> <span id="sidebarType"></span></p>
      <p><strong>Area:</strong> <span id="sidebarArea"></span></p>
      <p><strong>Parents:</strong> <span id="sidebarParents"></span></p>
      <p><strong>Children:</strong> <span id="sidebarChildren"></span></p>
      <p><strong>Video:</strong> <a id="sidebarVideo" href="#" target="_blank">Link</a></p>
      <p><strong>Image:</strong></p>
      <img id="sidebarImage" src="" alt="" width="80%">
      <p><strong>Edge GIFs:</strong></p>
      <div id="sidebarGifs"></div>
    </div>
    <div class="debug-sidebar">
      <span class="row">
        View:
        <select id="viewMode">
          <option value="graph">Graph View</option>
          <option value="tree">Tree View</option>
        </select>
      </span>
      <div id="graph-controls">
      <span class="row">
        Layout:
        <select id="layoutMode">
          <option value="cola">Cola</option>
          <option value="dagre">Dagre</option>
          <option value="concentric">Concentric</option>
        </select>
      </span>
      <span class="row">
        Edges:
        <select id="edgeStyleMode">
          <option value="straight">Straight</option>
          <option value="bezier">Bezier</option>
          <option value="unbundled-bezier">Unbundled Bezier</option>
          <option value="haystack">Haystack</option>
          <option value="segments">Segments</option>
          <option value="taxi">Taxi</option>
        </select>
      </span>
      <span class="row">
        <input type="checkbox" id="showLabelCheckbox">
        <label for="showLabelCheckbox">Show labels</label>
      </span>
      <span class="row">
        Node color:
        <input type="color" id="nodeColorPicker" value="#1f77b4">
        <button id="resetNodeColors">Reset</button>
        </span>
        <span class="row">
        Background:
        <input type="color" id="bgColorPicker" value="#5050a0">
        <button id="resetColors">Reset colors</button>
        </span>
        <span class="row">
        Edge color:
        <input type="color" id="edgeColorPicker" value="#AAFDE9">
      </span>
      </div>
      <div id="tree-controls" class="hidden">
        <span class="row">
          Root:
          <select id="treeRootSelect"></select>
        </span>
        <span class="row">
          Direction:
          <select id="treeDirection">
            <option value="forward">Forward</option>
            <option value="backward">Backward</option>
          </select>
        </span>
      </div>
    </div>
  </body>
</html>
