<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>BJJ Recursive Graph (Cytoscape)</title>
    <script src="https://unpkg.com/cytoscape@3.25.2/dist/cytoscape.min.js"></script>
    <script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
    <script src="https://unpkg.com/cytoscape-dagre/cytoscape-dagre.js"></script>
    <script src="https://unpkg.com/webcola/WebCola/cola.min.js"></script>
    <script src="https://unpkg.com/cytoscape-cola/cytoscape-cola.js"></script>
    <script src="https://unpkg.com/layout-base/layout-base.js"></script>
    <script src="https://unpkg.com/cose-base/cose-base.js"></script>
    <script src="https://unpkg.com/cytoscape-fcose@2.2.0/cytoscape-fcose.js"></script>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <div id="graph-container">
      <div id="cy"></div>
    </div>
    <div class="layout-toggle">
      <span class="row">
        Layout:
        <select id="layoutMode">
          <option value="fcose" selected>fCoSE</option>
          <option value="preset">Preset (saved)</option>
          <option value="cola">Cola</option>
          <option value="dagre">Dagre</option>
          <option value="concentric">Concentric</option>
        </select>
      </span>
      <span class="row">
        Edges:
        <select id="edgeStyleMode">
          <option value="straight">Straight</option>
          <option value="bezier">Bezier</option>
          <option value="unbundled-bezier">Unbundled Bezier</option>
          <option value="haystack">Haystack</option>
          <option value="segments">Segments</option>
          <option value="taxi">Taxi</option>
        </select>
      </span>
      <span class="row">
        <input type="checkbox" id="showLabelCheckbox">
        <label for="showLabelCheckbox">Show labels</label>
      </span>
      <span class="row">
        <button id="savePositions">Save positions</button>
        <button id="restoreBackup" style="margin-left: 8px; background: rgba(220, 50, 50, 0.2); color: #ff8888;">Restore Backup</button>
        <span id="saveStatus" class="save-status"></span>
      </span>
      <span class="row">
        Node color:
        <input type="color" id="nodeColorPicker" value="#1f77b4">
        <button id="resetNodeColors">Reset</button>
        </span>
        <span class="row">
        Background:
        <input type="color" id="bgColorPicker" value="#5050a0">
        <button id="resetColors">Reset colors</button>
        </span>
        <span class="row">
        Edge color:
        <input type="color" id="edgeColorPicker" value="#A9B7C6">
      </span>
    </div>

    <aside id="sidebar" class="sidebar">
      <div id="sb-resize-handle" class="resize-handle"></div>
      
      <div class="sidebar-header">
        <h2 id="sb-name">Node Inspector</h2>
        <button id="sb-close" class="icon-btn">&times;</button>
      </div>
      
      <div id="sb-multi-select" class="sidebar-content" style="display: none;">
        <h3>Selected Nodes</h3>
        <ul id="sb-multi-list" class="multi-list"></ul>
      </div>

      <div id="sb-single-content" class="sidebar-content">
        <div class="form-group">
          <label>TITLE</label>
          <input type="text" id="sb-title" placeholder="e.g. Mount">
        </div>
        <div class="form-group">
          <label>Type</label>
          <select id="sb-type">
            <option value="Guard">Guard</option>
            <option value="Pass">Pass</option>
            <option value="Predicament">Predicament</option>
            <option value="Submission">Submission</option>
            <option value="Takedown">Takedown</option>
            <option value="Control">Control</option>
            <option value="Neutral">Neutral</option>
          </select>
        </div>
        <div class="form-group">
          <label>Area</label>
          <div class="area-checkboxes">
            <label><input type="checkbox" value="Ground" class="sb-area-cb"> Ground</label>
            <label><input type="checkbox" value="Standing" class="sb-area-cb"> Standing</label>
            <label><input type="checkbox" value="Clinch" class="sb-area-cb"> Clinch</label>
          </div>
        </div>
        <div class="form-group">
          <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; text-transform: none;">
            <input type="checkbox" id="sb-stub" style="width: auto; margin: 0;">
            Temporary Stub (Dashed)
          </label>
        </div>

        <div class="form-group">
          <label>Notes</label>
          <textarea id="sb-notes" rows="6"></textarea>
        </div>
        
        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <label style="margin-bottom: 0;">Connections</label>
            <button id="sb-add-conn" class="btn small" style="padding: 4px 10px; font-size: 0.8rem; background: var(--accent); color: #fff;">+ Add Edge</button>
          </div>
          <div id="sb-connections" class="connections-container"></div>
        </div>
      </div>
      
      <div class="sidebar-footer">
        <button id="sb-edit" class="btn" style="display:none;">Edit</button>
        <button id="sb-save" class="btn primary">Save Node</button>
        <button id="sb-delete" class="btn danger">Delete Node</button>
      </div>
    </aside>
  </body>
</html>
